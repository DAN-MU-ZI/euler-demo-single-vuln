name: Euler Security CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, release, 'release/*']

permissions: {}

jobs:
  submit-to-euler:
    runs-on: ubuntu-latest
    steps:
      - name: 검사 이벤트를 Euler에 접수
        shell: bash
        env:
          EULER_BASE_URL: ${{ vars.EULER_BASE_URL }}
        run: |
          set -euo pipefail
          : "${EULER_BASE_URL:?EULER_BASE_URL 저장소 변수를 설정하세요.}"

          case "$GITHUB_EVENT_NAME" in
            push) endpoint=baseline ;;
            pull_request) endpoint=review ;;
            *) printf '지원하지 않는 이벤트입니다. %s\n' "$GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac

          response_file="$RUNNER_TEMP/euler-response.json"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            -H "Content-Type: application/json" \
            --data-binary "@$GITHUB_EVENT_PATH" \
            "${EULER_BASE_URL%/}/api/github/$endpoint")"

          cat "$response_file"
          if [[ "$status" != 202 ]]; then
            printf '\nEuler 검사 접수 실패 (HTTP %s)\n' "$status" >&2
            exit 1
          fi
